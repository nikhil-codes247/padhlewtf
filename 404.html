<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — this page is giving void · PADHLE.WTF</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #1a1a1a;
    --accent: #ffd23f;
    --surface: #fffdf5;
    --muted: #6b6b6b;
    --font-heading: "Kevin Sans", system-ui, sans-serif;
    --shadow: 4px 4px 0 #000;
    --shadow-hover: 6px 6px 0 #000;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: var(--font-heading);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .mascot {
    font-size: 120px;
    margin-bottom: 16px;
    filter: drop-shadow(4px 4px 0 #000);
    animation: bounce 2.5s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-20px) rotate(2deg); }
  }
  h1 {
    font-family: var(--font-heading);
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: -0.04em;
    line-height: 1.1;
    margin: 0 0 12px;
    text-transform: uppercase;
    text-shadow: 4px 4px 0 #000;
  }
  .genz-line {
    font-size: clamp(1rem, 4vw, 1.5rem);
    font-weight: 700;
    color: #d32f2f;
    margin: 0 0 20px;
    text-shadow: 2px 2px 0 #ffd23f;
    animation: wiggle 3s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-1deg); }
    25% { transform: rotate(2deg); }
    75% { transform: rotate(-2deg); }
  }
  p.muted {
    color: var(--muted);
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .btn {
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 26px;
    background: #000;
    color: #fff;
    border: 2px solid #000;
    box-shadow: var(--shadow);
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: transform 0.1s, box-shadow 0.1s, background 0.1s;
  }
  .btn:hover {
    background: var(--accent);
    color: #000;
    transform: translate(-3px, -3px);
    box-shadow: var(--shadow-hover);
  }
  .btn:active {
    transform: translate(2px, 2px);
    box-shadow: none;
  }
  .btn.primary { background: #d32f2f; color: #fff; }
  .btn.primary:hover { background: #ffd23f; color: #000; }
  .study-decor {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: repeating-linear-gradient(90deg, #ffd23f, #ffd23f 10px, #d32f2f 10px, #d32f2f 20px);
    z-index: 10;
  }
  .pencil {
    position: fixed;
    bottom: -40px;
    left: 10%;
    font-size: 60px;
    transform: rotate(-15deg);
    animation: pencil-bob 4s ease-in-out infinite;
    z-index: 1;
  }
  @keyframes pencil-bob {
    0%, 100% { transform: translateY(0) rotate(-15deg); }
    50% { transform: translateY(-30px) rotate(-10deg); }
  }
  .chalk {
    position: fixed;
    bottom: -50px;
    right: 8%;
    font-size: 50px;
    transform: rotate(10deg);
    animation: chalk-bob 5s ease-in-out infinite 1s;
    z-index: 1;
  }
  @keyframes chalk-bob {
    0%, 100% { transform: translateY(0) rotate(10deg); }
    50% { transform: translateY(-25px) rotate(5deg); }
  }
  .book {
    position: fixed;
    top: 20%;
    left: -60px;
    font-size: 80px;
    animation: book-float 6s ease-in-out infinite 2s;
    z-index: 1;
  }
  @keyframes book-float {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-40px) rotate(5deg); }
  }
  @media (max-width: 640px) {
    .mascot { font-size: 80px; }
    h1 { font-size: 2rem; }
    .genz-line { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <div class="study-decor"></div>
  <div class="pencil">✏️</div>
  <div class="chalk">📚</div>
  <div class="book">📖</div>

  <div class="mascot">🦉</div>
  <h1>404 · page not found</h1>
  <p class="genz-line">bestie, this link is dead <span aria-hidden="true">☠️</span></p>
  <p class="muted">
    The address <strong id="bad-url"></strong> doesn&rsquo;t exist in our syllabus. No cap, we checked every chapter — it&rsquo;s not there.
  </p>
  <a class="btn primary" href="/">take me back to the dashboard <span aria-hidden="true">↗</span></a>
  <p class="muted" style="margin-top: 20px; font-size: 0.9rem;">
    Need help? <a href="mailto:support@padhle.wtf" style="color:var(--ink); text-decoration:underline; font-weight:700;">support@padhle.wtf</a> <span class="muted" style="font-weight:normal;">·</span> <a href="mailto:feedback@padhle.wtf" style="color:var(--ink); text-decoration:underline; font-weight:700;">feedback@padhle.wtf</a>
  </p>

  <script>
    document.getElementById("bad-url").textContent = location.pathname;
  </script>
</body>
</html>
