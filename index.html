<script>
  /*
   * The Android shell injects its bridge before the document is ever parsed, so
   * this can set the shell theme attribute before the first paint. In a browser
   * the bridge is absent and nothing happens. Kept inline and dependency-free on
   * purpose: it has to run before paint, so a deferred module is too late.
   */
  (function () {
    try {
      var bridge = window.PADHLE_WTF || window.Padhle;
      if (bridge && typeof bridge.platform === "function") {
        document.documentElement.setAttribute("data-brand", "padhle-wtf");
        document.title = "PADHLE.WTF";
      }
    } catch (e) { /* the shell is optional; on failure, browser branding applies */ }
  })();
</script>

      <p>PADHLE.WTF is a study workspace for CBSE Class 10 students. It tracks the 2026–27 syllabus, plans revision across the run-up to the boards, runs timed focus sessions, and shows what past papers actually asked. Accounts sync subjects, planner tasks, notes and progress across devices. Full access is a one-time payment of ₹199 and stays active until 10 March 2027.</p>
      <p><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a> · <a href="mailto:support@padhle.wtf">Contact support</a></p>
      <p>Please enable JavaScript to open the study workspace.</p>
    </main>
  </noscript>
